services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./init_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql
      - ./pogotowie_db_backup.sql:/docker-entrypoint-initdb.d/01_backup.sql
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: